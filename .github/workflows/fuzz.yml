name: Fuzz Testing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run a deeper fuzzing session every night at midnight
    - cron: '0 0 * * *'

jobs:
  fuzz:
    runs-on: ubuntu-latest
    env:
      # GitHub Actions pipes core_pattern to systemd-coredump, which breaks
      # AFL's waitpid() crash detection. QEMU mode (-Q) still catches crashes
      # via runtime instrumentation; this flag just disables the core_pattern check.
      AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Zig directly to avoid action incompatibility with newer runner Node versions
      - name: Install Zig
        run: |
          ZIG_VERSION=0.16.0
          ZIG_TARBALL="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          ZIG_URL="https://ziglang.org/download/${ZIG_VERSION}/${ZIG_TARBALL}"
          curl -fsSLO "$ZIG_URL"
          tar -xf "$ZIG_TARBALL"
          echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}/" >> "$GITHUB_PATH"
          echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}/lib" >> "$GITHUB_PATH"
          ./zig-x86_64-linux-${ZIG_VERSION}/zig version

      - name: Pull AFL++ Docker image
        run: docker pull aflplusplus/aflplusplus:latest

      - name: Build Fuzz Target
        run: zig build -p ./zig-out

      - name: Prepare Seed Corpus
        run: |
          mkdir -p fuzz_in
          echo "SELECT * FROM users;" > fuzz_in/select.sql
          echo "INSERT INTO users VALUES (1, 'Test');" > fuzz_in/insert.sql
          echo "CREATE TABLE dummy (id INT);" > fuzz_in/create.sql
          echo "SELECT * FROM t1 JOIN t2 ON t1.id = t2.id;" > fuzz_in/join.sql

      - name: Run AFL++ (QEMU Mode)
        # Run for 60 seconds on PRs, or 10 minutes on nightly
        run: |
          FUZZ_TIME=$([[ "${{ github.event_name }}" == "schedule" ]] && echo "600" || echo "60")
          echo "Running fuzzer for $FUZZ_TIME seconds..."

          # We use -Q (QEMU mode) because we compiled the Zig binary normally without afl-clang instrumentation
          # AFL++ will dynamically instrument the binary at runtime
          docker run --rm -v $PWD:/work -w /work \
            -e AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES=1 \
            -e AFL_SKIP_CPUFAST=1 \
            aflplusplus/aflplusplus:latest \
            afl-fuzz -Q -i fuzz_in -o fuzz_out -V $FUZZ_TIME -- ./zig-out/bin/fuzz
          
          # Fix permissions of root-created output directory for later steps
          sudo chown -R $USER:$USER fuzz_out

      - name: Check for Crashes
        run: |
          CRASHES=$(ls fuzz_out/default/crashes/id* 2>/dev/null | wc -l || echo "0")
          if [ "$CRASHES" -gt 0 ]; then
            echo "::error::Fuzzer discovered $CRASHES crashes! Check artifacts."
            exit 1
          else
            echo "No crashes found."
          fi

      - name: Upload Crash Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzzer-crashes
          path: fuzz_out/default/crashes/

      - name: Cleanup
        run: rm -rf fuzz_in fuzz_out